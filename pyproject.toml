[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirs-navigator"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = []
authors = [
  { name = "José Albert Cruz Almaguer", email = "jalbertcruz@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "cattrs~=24.1.2",
  "python-decouple~=3.8",
  "typer~=0.15.1",
  "PyYAML~=6.0.2",
  "rich~=13.9.4",
  "more-itertools~=10.5.0",
]

[dependency-groups]
dev = [
  "basedpyright~=1.23.1",
  "black~=24.10.0",
  "pylint~=3.3.3",
  "coverage[toml]>=7.6.10",
  "pytest>=8.3.4",
]

[project.urls]
Documentation = "https://github.com/jdev-ops/dirs-navigator#readme"

[project.scripts]
senv = "dirs_navigator.navigator:sel_env"
_choose-project = "dirs_navigator.navigator:choose_project"
_projects-names = "dirs_navigator.navigator:projects_names"
_project-path = "dirs_navigator.project_path:main"
#_choose-destination = "dirs_navigator.navigator:choose_destination"
_vim-translator = "fzf_utilities._vim_translator:main"

[tool.hatch.version]
path = "src/dirs_navigator/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]",
  "pytest",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.13"]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/dirs_navigator tests}"

[tool.hatch.build.targets.sdist]
exclude = [
  "bin/*",
]
include = [
  "src/",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/dirs_navigator",
  "src/fzf_utilities",
]
